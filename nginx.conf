# A template: the nginx image fills in ${NGINX_LOCAL_RESOLVERS} from the
# container's /etc/resolv.conf when it starts (see the Dockerfile), and the
# BenchLM and TMDB keys from the container's environment (see .env.example).

# Answers from the keyed services are kept for half a week, so BenchLM and TMDB
# are asked at most twice a week however many people open the dashboard.
proxy_cache_path /var/cache/nginx/dashboard levels=1:2 keys_zone=dashboard:1m max_size=50m inactive=8d use_temp_path=off;

# The only settings the keyed relays pass on; anything else asks for the default,
# so a stranger can't spend the month's reads by varying the address.
map $arg_surface $benchlm_surface {
  default overall;
  coding coding;
  agentic agentic;
  knowledge knowledge;
}

map $arg_window $tmdb_window {
  default week;
  day day;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Prices for the dashboard's markets widget. Yahoo Finance doesn't answer
  # browsers on other sites, so this server asks on the page's behalf. Only
  # the chart endpoint is reachable, only with GET, and no cookies go either way.
  location /api/markets/ {
    limit_except GET {
      deny all;
    }

    # Resolved per request, so the container starts even while DNS is not up yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $yahoo query1.finance.yahoo.com;
    rewrite ^/api/markets/(.*)$ /v8/finance/chart/$1 break;
    proxy_pass https://$yahoo;
    proxy_ssl_server_name on;
    # Yahoo turns away handshakes that look like a script's; a browser-like
    # cipher order gets through (the same list as vite.config.ts).
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA;
    proxy_ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    proxy_set_header Host $yahoo;
    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=300";
  }

  # The AI Leaderboard widget's rankings. The key is added here and never
  # reaches the page; one answer per ranking is kept for 84 hours.
  location = /api/benchlm/rankings {
    limit_except GET {
      deny all;
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $benchlm data.benchlm.ai;
    rewrite ^ /v1/rankings/current?surface=$benchlm_surface&limit=50? break;
    proxy_pass https://$benchlm;
    proxy_ssl_server_name on;
    proxy_set_header Host $benchlm;
    proxy_set_header Authorization "Bearer ${BENCHLM_TOKEN}";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache dashboard;
    proxy_cache_key benchlm:$benchlm_surface;
    proxy_cache_valid 200 84h;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Cache-Status $upstream_cache_status;
  }

  # The Popular TV widget's list, kept the same way.
  location = /api/tmdb/trending-tv {
    limit_except GET {
      deny all;
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $tmdb api.themoviedb.org;
    rewrite ^ /3/trending/tv/$tmdb_window?language=en-US? break;
    proxy_pass https://$tmdb;
    proxy_ssl_server_name on;
    proxy_set_header Host $tmdb;
    proxy_set_header Authorization "Bearer ${TMDB_TOKEN}";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache dashboard;
    proxy_cache_key tmdb:tv:$tmdb_window;
    proxy_cache_valid 200 84h;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Cache-Status $upstream_cache_status;
  }
}
