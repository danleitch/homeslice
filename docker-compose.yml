services:
  branchify:
    build:
      context: .
      dockerfile: Dockerfile
    image: branchify:latest
    container_name: branchify
    ports:
      - '80'
    # BENCHLM_TOKEN and TMDB_TOKEN, for the widgets that need a key; see .env.example.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
