services:
  homeslice:
    build:
      context: .
      dockerfile: Dockerfile
    image: blades/homeslice:latest
    container_name: homeslice
    ports:
      - '80'
    # BENCHLM_TOKEN, TMDB_TOKEN and CALENDAR_ICAL_URL, for the widgets that need a key
    # or an address; see .env.example.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
